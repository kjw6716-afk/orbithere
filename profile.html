<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit | 프로필</title>
    <meta name="description" content="나의 궤도 프로필 — 레벨, 궤적, 연결된 별을 확인하세요.">
    <meta name="theme-color" content="#0F172A">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Orbit">
    <meta property="og:title" content="Orbit | 프로필">
    <meta property="og:description" content="나의 궤도 프로필 — 레벨, 궤적, 연결된 별을 확인하세요.">
    <meta property="og:image" content="https://orbithere.com/images/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://orbithere.com/profile.html">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            --bg: #0F172A;
            --accent: #FF9F43;
            --card: rgba(30,41,59,0.7);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--bg);
            color: #E2E8F0;
            font-family: 'Pretendard', sans-serif;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* 배경 글로우 */
        .bg-glow {
            position: fixed; top: -10%; left: -10%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(255,159,67,0.07) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
        }
        .bg-glow2 {
            position: fixed; bottom: -10%; right: -10%;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(255,183,77,0.05) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
        }

        /* 진입 애니메이션 */
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(24px); }
            to   { opacity:1; transform:translateY(0); }
        }

        .wrapper {
            position: relative; z-index: 1;
            display: flex; flex-direction: column;
            align-items: center; gap: 20px;
            padding: 40px 20px;
            width: 100%; max-width: 480px;
        }

        /* 진입 타이틀 */
        .enter-title {
            font-size: 0.8rem; letter-spacing: 0.2em;
            color: var(--accent); opacity: 0.6; font-weight: 300;
            animation: fadeUp 0.6s ease forwards;
        }

        /* 프로필 카드 */
        .profile-card {
            width: 100%;
            background: var(--card);
            border: 1px solid rgba(255,159,67,0.2);
            border-radius: 28px; padding: 32px;
            animation: fadeUp 0.7s ease 0.1s both;
            position: relative; overflow: hidden;
        }
        .profile-card::before {
            content: '';
            position: absolute; top: -40px; right: -40px;
            width: 180px; height: 180px;
            background: radial-gradient(circle, rgba(255,159,67,0.07) 0%, transparent 70%);
            pointer-events: none;
        }

        /* 아바타 */
        .avatar-wrap {
            display: flex; align-items: center; gap: 20px;
            margin-bottom: 24px;
        }
        .avatar {
            width: 72px; height: 72px; border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,159,67,0.2), rgba(255,183,77,0.15));
            border: 2px solid rgba(255,159,67,0.3);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; flex-shrink: 0;
        }
        .avatar-info { flex: 1; }
        .nickname {
            font-size: 1.4rem; font-weight: 700;
            color: #E2E8F0; margin-bottom: 4px;
        }
        .join-date {
            font-size: 0.75rem; color: #475569; font-weight: 400;
        }

        /* 레벨 바 */
        .level-section { margin-bottom: 22px; }
        .level-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 8px;
        }
        .level-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 12px; border-radius: 99px;
            background: rgba(255,159,67,0.1);
            border: 1px solid rgba(255,159,67,0.2);
            font-size: 12px; font-weight: 700; color: var(--accent);
        }
        .level-badge .star { font-size: 10px; }
        .exp-text {
            font-size: 11px; color: #334155; font-weight: 500;
        }
        .exp-bar {
            width: 100%; height: 4px;
            background: rgba(255,255,255,0.06);
            border-radius: 2px; overflow: hidden;
        }
        .exp-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--accent), #FC8181);
            border-radius: 2px;
            transition: width 1.2s cubic-bezier(0.4,0,0.2,1) 0.5s;
        }

        /* 스탯 그리드 */
        .stats {
            display: grid; grid-template-columns: repeat(3,1fr);
            gap: 10px; margin-bottom: 24px;
        }
        .stat-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px; padding: 14px 10px;
            text-align: center;
        }
        .stat-val {
            font-size: 1.1rem; font-weight: 700;
            color: var(--accent); margin-bottom: 4px;
        }
        .stat-label {
            font-size: 10px; color: #334155;
            font-weight: 500; letter-spacing: 0.04em;
        }

        /* 태그 */
        .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 24px; }
        .tag {
            font-size: 11px; padding: 3px 10px;
            border-radius: 8px; font-weight: 600;
        }
        .tag.new { background: rgba(255,159,67,0.1); color: var(--accent); border: 1px solid rgba(255,159,67,0.2); }
        .tag.beta { background: rgba(159,122,234,0.1); color: #9F7AEA; border: 1px solid rgba(159,122,234,0.2); }

        /* 버튼들 */
        .btn-primary {
            width: 100%; padding: 14px;
            background: var(--accent); color: #0F172A;
            border: none; border-radius: 14px;
            font-size: 14px; font-weight: 700;
            cursor: pointer; transition: 0.2s;
            font-family: 'Pretendard'; margin-bottom: 10px;
        }
        .btn-primary:hover { opacity: 0.88; transform: scale(0.99); }

        .btn-secondary {
            width: 100%; padding: 12px;
            background: transparent; color: #475569;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            font-size: 13px; font-weight: 500;
            cursor: pointer; transition: 0.2s;
            font-family: 'Pretendard';
        }
        .btn-secondary:hover { border-color: rgba(255,159,67,0.3); color: var(--accent); }

        .btn-logout {
            width: 100%; padding: 11px; margin-top: 4px;
            background: transparent; color: #475569;
            border: none; border-radius: 14px;
            font-size: 12px; font-weight: 500;
            cursor: pointer; transition: 0.2s; font-family: 'Pretendard';
        }
        .btn-logout:hover { color: #FC8181; }

        /* 베타 안내 */
        .beta-notice {
            font-size: 11px; color: #334155;
            text-align: center; line-height: 1.6;
            animation: fadeUp 0.7s ease 0.3s both;
        }


        /* ===== 공통 푸터 ===== */
        .site-footer {
            text-align: center; margin-top: 4px;
            animation: fadeUp 0.7s ease 0.4s both;
        }
        .foot-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 10px; }
        .foot-links a { font-size: 11px; color: #475569; text-decoration: none; transition: color 0.2s; }
        .foot-links a:hover { color: #FF9F43; }
        .foot-sign {
            font-size: 10.5px; color: #334155; letter-spacing: 0.03em;
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .foot-star { width: 12px; height: 12px; flex-shrink: 0; animation: foot-twinkle 2.8s ease-in-out infinite; }
        @keyframes foot-twinkle {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.85; }
            50%      { transform: scale(1.2) rotate(18deg); opacity: 1; }
        }

        ::selection { background-color: #4FD1C5; color: #0F172A; }

        @media (max-width: 480px) {
            .profile-card { padding: 24px 20px; }
            .nickname { font-size: 1.2rem; }
        }
    </style>
    <script src="effects.js" defer></script>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow2"></div>

    <div class="wrapper">
        <div class="enter-title">— 궤도 진입 완료 —</div>

        <div class="profile-card">
            <div class="avatar-wrap">
                <div class="avatar" id="avatarEmoji">🌟</div>
                <div class="avatar-info">
                    <div class="nickname" id="nicknameText">—</div>
                    <div class="join-date" id="joinDateText">가입일 —</div>
                </div>
            </div>

            <div class="level-section">
                <div class="level-header">
                    <div class="level-badge">
                        <span class="star">★</span> Lv.1 신성 탐험가
                    </div>
                    <div class="exp-text">0 / 100 XP</div>
                </div>
                <div class="exp-bar">
                    <div class="exp-fill" id="expFill"></div>
                </div>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-val" id="orbitDays">1</div>
                    <div class="stat-label">궤도 일수</div>
                </div>
                <div class="stat-item">
                    <div class="stat-val">0</div>
                    <div class="stat-label">궤적</div>
                </div>
                <div class="stat-item">
                    <div class="stat-val">0</div>
                    <div class="stat-label">연결된 별</div>
                </div>
            </div>

            <div class="tags">
                <span class="tag new">🆕 신규 멤버</span>
                <span class="tag beta">β 베타 참여자</span>
            </div>

            <button class="btn-primary" onclick="goMain()">커뮤니티로 이동하기</button>
            <button class="btn-secondary" onclick="goIndex()">처음으로 돌아가기</button>
            <button class="btn-logout" onclick="logout()">로그아웃</button>
        </div>

        <div class="beta-notice">
            베타 버전이라 닉네임 중복이 생길 수 있어요.<br>
            추후 정식 계정 시스템이 도입될 예정이에요.
        </div>

        <footer class="site-footer">
            <div class="foot-links">
                <a href="terms.html">이용약관</a>
                <a href="privacy.html">개인정보처리방침</a>
            </div>
            <div class="foot-sign">
                © 2026 Orbit · Made with
                <svg class="foot-star" viewBox="0 0 100 100" aria-hidden="true"><path d="M 50 15 L 62 34 L 83 39 L 69 56 L 71 78 L 50 70 L 29 78 L 31 56 L 17 39 L 38 34 Z" fill="#FF9F43" stroke="#FF9F43" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/></svg>
                in orbit
            </div>
        </footer>
    </div>

    <script>
    // 닉네임 불러오기
    var nickname = localStorage.getItem('orbit_nickname');
    if(!nickname){
        window.location.href = 'main.html';
    } else {
        document.getElementById('nicknameText').textContent = nickname;

        // 가입일
        var joinDate = localStorage.getItem('orbit_joindate');
        if(!joinDate){
            joinDate = new Date().toLocaleDateString('ko-KR', {year:'numeric',month:'long',day:'numeric'});
            localStorage.setItem('orbit_joindate', joinDate);
        }
        document.getElementById('joinDateText').textContent = joinDate + ' 궤도 진입';

        // 궤도 일수 — 가입 시점부터 실제 경과일 계산
        var jointime = parseInt(localStorage.getItem('orbit_jointime'), 10);
        if(!jointime){
            // 기존 가입자: 한국어 가입일 문자열에서 날짜 복원
            var m = joinDate.match(/(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/);
            jointime = m ? new Date(+m[1], m[2]-1, +m[3]).getTime() : Date.now();
            localStorage.setItem('orbit_jointime', jointime);
        }
        var orbitDays = Math.max(1, Math.floor((Date.now() - jointime) / 86400000) + 1);
        document.getElementById('orbitDays').textContent = orbitDays;

        // 아바타 이모지 — 닉네임 첫 글자 기반으로 배정
        var emojis = ['🌟','⭐','🪐','🌙','☄️','🔭','🛸','💫','🌌','✨'];
        var idx = nickname.charCodeAt(0) % emojis.length;
        document.getElementById('avatarEmoji').textContent = emojis[idx];

        // XP 바 애니메이션 (약간의 딜레이 후)
        setTimeout(function(){
            document.getElementById('expFill').style.width = '3%';
        }, 300);
    }

    function goMain(){ window.location.href = 'main.html'; }
    function goIndex(){ window.location.href = 'index.html'; }
    function logout(){
        if(!confirm('로그아웃 하시겠어요? 이 기기에서 닉네임이 해제됩니다.')) return;
        localStorage.removeItem('orbit_nickname');
        localStorage.removeItem('orbit_joindate');
        localStorage.removeItem('orbit_jointime');
        window.location.href = 'index.html';
    }

    </script>
</body>
</html>
