<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit | 프로필</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            --bg: #0F172A;
            --mint: #4FD1C5;
            --card: rgba(30,41,59,0.7);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--bg);
            color: #E2E8F0;
            font-family: 'Pretendard', sans-serif;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* 배경 글로우 */
        .bg-glow {
            position: fixed; top: -10%; left: -10%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(79,209,197,0.07) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
        }
        .bg-glow2 {
            position: fixed; bottom: -10%; right: -10%;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(99,179,237,0.05) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
        }

        /* 진입 애니메이션 */
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(24px); }
            to   { opacity:1; transform:translateY(0); }
        }

        .wrapper {
            position: relative; z-index: 1;
            display: flex; flex-direction: column;
            align-items: center; gap: 20px;
            padding: 40px 20px;
            width: 100%; max-width: 480px;
        }

        /* 진입 타이틀 */
        .enter-title {
            font-size: 0.8rem; letter-spacing: 0.2em;
            color: var(--mint); opacity: 0.6; font-weight: 300;
            animation: fadeUp 0.6s ease forwards;
        }

        /* 프로필 카드 */
        .profile-card {
            width: 100%;
            background: var(--card);
            border: 1px solid rgba(79,209,197,0.2);
            border-radius: 28px; padding: 32px;
            animation: fadeUp 0.7s ease 0.1s both;
            position: relative; overflow: hidden;
        }
        .profile-card::before {
            content: '';
            position: absolute; top: -40px; right: -40px;
            width: 180px; height: 180px;
            background: radial-gradient(circle, rgba(79,209,197,0.07) 0%, transparent 70%);
            pointer-events: none;
        }

        /* 아바타 */
        .avatar-wrap {
            display: flex; align-items: center; gap: 20px;
            margin-bottom: 24px;
        }
        .avatar {
            width: 72px; height: 72px; border-radius: 50%;
            background: linear-gradient(135deg, rgba(79,209,197,0.2), rgba(99,179,237,0.15));
            border: 2px solid rgba(79,209,197,0.3);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; flex-shrink: 0;
        }
        .avatar-info { flex: 1; }
        .nickname {
            font-size: 1.4rem; font-weight: 700;
            color: #E2E8F0; margin-bottom: 4px;
        }
        .join-date {
            font-size: 0.75rem; color: #475569; font-weight: 400;
        }

        /* 레벨 바 */
        .level-section { margin-bottom: 22px; }
        .level-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 8px;
        }
        .level-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 12px; border-radius: 99px;
            background: rgba(79,209,197,0.1);
            border: 1px solid rgba(79,209,197,0.2);
            font-size: 12px; font-weight: 700; color: var(--mint);
        }
        .level-badge .star { font-size: 10px; }
        .exp-text {
            font-size: 11px; color: #334155; font-weight: 500;
        }
        .exp-bar {
            width: 100%; height: 4px;
            background: rgba(255,255,255,0.06);
            border-radius: 2px; overflow: hidden;
        }
        .exp-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--mint), #63B3ED);
            border-radius: 2px;
            transition: width 1.2s cubic-bezier(0.4,0,0.2,1) 0.5s;
        }

        /* 스탯 그리드 */
        .stats {
            display: grid; grid-template-columns: repeat(3,1fr);
            gap: 10px; margin-bottom: 24px;
        }
        .stat-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px; padding: 14px 10px;
            text-align: center;
        }
        .stat-val {
            font-size: 1.1rem; font-weight: 700;
            color: var(--mint); margin-bottom: 4px;
        }
        .stat-label {
            font-size: 10px; color: #334155;
            font-weight: 500; letter-spacing: 0.04em;
        }

        /* 태그 */
        .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 24px; }
        .tag {
            font-size: 11px; padding: 3px 10px;
            border-radius: 8px; font-weight: 600;
        }
        .tag.new { background: rgba(79,209,197,0.1); color: var(--mint); border: 1px solid rgba(79,209,197,0.2); }
        .tag.beta { background: rgba(159,122,234,0.1); color: #9F7AEA; border: 1px solid rgba(159,122,234,0.2); }

        /* 버튼들 */
        .btn-primary {
            width: 100%; padding: 14px;
            background: var(--mint); color: #0F172A;
            border: none; border-radius: 14px;
            font-size: 14px; font-weight: 700;
            cursor: pointer; transition: 0.2s;
            font-family: 'Pretendard'; margin-bottom: 10px;
        }
        .btn-primary:hover { opacity: 0.88; transform: scale(0.99); }

        .btn-secondary {
            width: 100%; padding: 12px;
            background: transparent; color: #475569;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            font-size: 13px; font-weight: 500;
            cursor: pointer; transition: 0.2s;
            font-family: 'Pretendard';
        }
        .btn-secondary:hover { border-color: rgba(79,209,197,0.3); color: var(--mint); }

        /* 베타 안내 */
        .beta-notice {
            font-size: 11px; color: #334155;
            text-align: center; line-height: 1.6;
            animation: fadeUp 0.7s ease 0.3s both;
        }

        /* 클릭 이펙트 */
        .click-ripple {
            position: fixed; border-radius: 50%;
            border: 1.5px solid #4FD1C5; pointer-events: none; z-index: 9998;
            box-shadow: 0 0 8px rgba(79,209,197,0.4);
            animation: ripple-expand 0.8s cubic-bezier(0.2,0.8,0.4,1) forwards;
        }
        @keyframes ripple-expand {
            0%   { width:10px; height:10px; opacity:0.9; transform:translate(-50%,-50%) scale(0); }
            100% { width:130px; height:130px; opacity:0; transform:translate(-50%,-50%) scale(1); }
        }
        .click-star {
            position: fixed; pointer-events: none; z-index: 9999;
            color: #4FD1C5; filter: drop-shadow(0 0 4px #4FD1C5);
            animation: star-burst 0.9s cubic-bezier(0,.9,.57,1) forwards;
            user-select: none; line-height: 1;
        }
        @keyframes star-burst {
            0%   { opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg); }
            100% { opacity:0; transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(0) rotate(var(--rot)); }
        }

        @media (max-width: 480px) {
            .profile-card { padding: 24px 20px; }
            .nickname { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow2"></div>

    <div class="wrapper">
        <div class="enter-title">— 궤도 진입 완료 —</div>

        <div class="profile-card">
            <div class="avatar-wrap">
                <div class="avatar" id="avatarEmoji">🌟</div>
                <div class="avatar-info">
                    <div class="nickname" id="nicknameText">—</div>
                    <div class="join-date" id="joinDateText">가입일 —</div>
                </div>
            </div>

            <div class="level-section">
                <div class="level-header">
                    <div class="level-badge">
                        <span class="star">★</span> Lv.1 신성 탐험가
                    </div>
                    <div class="exp-text">0 / 100 XP</div>
                </div>
                <div class="exp-bar">
                    <div class="exp-fill" id="expFill"></div>
                </div>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-val">1</div>
                    <div class="stat-label">궤도 일수</div>
                </div>
                <div class="stat-item">
                    <div class="stat-val">0</div>
                    <div class="stat-label">궤적</div>
                </div>
                <div class="stat-item">
                    <div class="stat-val">0</div>
                    <div class="stat-label">연결된 별</div>
                </div>
            </div>

            <div class="tags">
                <span class="tag new">🆕 신규 멤버</span>
                <span class="tag beta">β 베타 참여자</span>
            </div>

            <button class="btn-primary" onclick="goMain()">커뮤니티로 이동하기</button>
            <button class="btn-secondary" onclick="goIndex()">처음으로 돌아가기</button>
        </div>

        <div class="beta-notice">
            베타 버전이라 닉네임 중복이 생길 수 있어요.<br>
            추후 정식 계정 시스템이 도입될 예정이에요.
        </div>
    </div>

    <script>
    // 닉네임 불러오기
    var nickname = localStorage.getItem('orbit_nickname');
    if(!nickname){
        window.location.href = 'main.html';
    } else {
        document.getElementById('nicknameText').textContent = nickname;

        // 가입일
        var joinDate = localStorage.getItem('orbit_joindate');
        if(!joinDate){
            joinDate = new Date().toLocaleDateString('ko-KR', {year:'numeric',month:'long',day:'numeric'});
            localStorage.setItem('orbit_joindate', joinDate);
        }
        document.getElementById('joinDateText').textContent = joinDate + ' 궤도 진입';

        // 아바타 이모지 — 닉네임 첫 글자 기반으로 배정
        var emojis = ['🌟','⭐','🪐','🌙','☄️','🔭','🛸','💫','🌌','✨'];
        var idx = nickname.charCodeAt(0) % emojis.length;
        document.getElementById('avatarEmoji').textContent = emojis[idx];

        // XP 바 애니메이션 (약간의 딜레이 후)
        setTimeout(function(){
            document.getElementById('expFill').style.width = '3%';
        }, 300);
    }

    function goMain(){ window.location.href = 'main.html'; }
    function goIndex(){ window.location.href = 'index.html'; }

    // 클릭 이펙트
    document.addEventListener('click', function(e){
        var ripple = document.createElement('div');
        ripple.classList.add('click-ripple');
        ripple.style.left = e.clientX + 'px';
        ripple.style.top  = e.clientY + 'px';
        document.body.appendChild(ripple);
        setTimeout(function(){ ripple.remove(); }, 800);

        var count = Math.floor(Math.random()*4)+4;
        for(let i=0;i<count;i++){
            const star = document.createElement('div');
            star.classList.add('click-star');
            star.innerHTML = '★';
            star.style.left = e.clientX + 'px';
            star.style.top  = e.clientY + 'px';
            const angle = Math.random()*2*Math.PI;
            const dist  = Math.random()*60+30;
            star.style.setProperty('--tx', Math.cos(angle)*dist + 'px');
            star.style.setProperty('--ty', Math.sin(angle)*dist + 'px');
            star.style.setProperty('--rot', (Math.random()-0.5)*360 + 'deg');
            star.style.fontSize = (Math.random()*8+8) + 'px';
            document.body.appendChild(star);
            setTimeout(function(){ star.remove(); }, 900);
        }
    });
    </script>
</body>
</html>
