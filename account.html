<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,follow" />
    <meta name="referrer" content="no-referrer" />
    <title>내 계정 · Orbit</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="orbit.css?v=20260912-brand" />
    <link rel="stylesheet" href="account.css?v=20260926-operator" />
  </head>
  <body class="account-callback">
    <p class="account-return-status" role="status">로그인을 확인하고 있어요…</p>
    <template id="accountTemplate"><div class="account-main">
      <p
        id="accountStatus"
        class="account-status"
        role="status"
        aria-live="polite"
      >
        계정을 확인하고 있어요.
      </p>
      <section id="authCard" class="account-card" hidden>
        <h2 id="authTitle" class="sr-only">로그인</h2>
        <p id="authHelp" class="account-help"></p>
        <div id="googleAuth" hidden>
          <button id="googleSignIn" class="google-signin" type="button">
            <img
              src="google-signin-icon.svg"
              width="40"
              height="40"
              alt=""
              aria-hidden="true"
            /><span>Google로 계속하기</span>
          </button>
          <p class="account-help account-divider">또는 이메일로 계속하기</p>
        </div>
        <form id="authForm">
          <label for="email">이메일</label
          ><input
            id="email"
            type="email"
            autocomplete="email"
            maxlength="254"
            required
          />
          <div id="passwordField">
            <label for="password">비밀번호</label
            ><input
              id="password"
              type="password"
              autocomplete="current-password"
              minlength="6"
              maxlength="128"
              required
            />
          </div>
          <label id="signupConsent" class="account-consent" hidden
            ><input id="consent" type="checkbox" /><span
              >만 14세 이상이며
              <a href="terms.html" target="_blank" rel="noopener">이용약관</a>
              및
              <a href="privacy.html#membership" target="_blank" rel="noopener"
                >회원정보 수집·이용 안내</a
              >를 읽고 동의합니다.</span
            ></label
          ><button id="authSubmit" type="submit">로그인</button>
        <p class="account-reset"><button id="resetLink" type="button" data-mode="reset">비밀번호 찾기</button><button id="resetBack" type="button" data-mode="login" hidden>로그인으로 돌아가기</button></p></form>
      </section>
      <section id="verifyCard" class="account-card" hidden>
        <h2 class="sr-only">인증번호 입력</h2>
        <p class="account-help"><span id="verifyEmail"></span>에 보낸 인증번호를 입력해주세요.</p>
        <form id="verifyForm">
          <label for="emailCode">인증번호 6자리</label>
          <input id="emailCode" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required aria-describedby="verifyExpiry" />
          <p id="verifyExpiry" class="account-help"></p>
          <button id="verifySubmit" type="submit">인증하고 계속하기</button>
        </form>
        <div class="account-verify-actions"><button id="resendCode" type="button" class="secondary">인증번호 다시 받기</button><button id="verifyBack" type="button" class="secondary">이메일 수정</button></div>
      </section>
      <section id="setupCard" class="account-card" hidden>
        <h2>닉네임 정하기</h2>
        <p class="account-help">
          닉네임은 2~12자로 정해주세요. 저장 후 30일마다 바꿀 수 있어요.
        </p>
        <form id="profileForm">
          <label for="memberNickname">닉네임</label
          ><input
            id="memberNickname"
            minlength="2"
            maxlength="12"
            autocomplete="nickname"
            required
          /><label id="profileConsentField" class="account-consent"
            ><input id="profileConsent" type="checkbox" required /><span
              >만 14세 이상이며
              <a href="terms.html" target="_blank" rel="noopener">이용약관</a>과
              <a href="privacy.html#membership" target="_blank" rel="noopener"
                >회원정보 수집·이용 안내</a
              >에 동의합니다.</span
            ></label
          ><button type="submit">프로필 저장</button>
        </form>
      </section>
      <section id="profileCard" class="account-card account-profile" hidden>
        <div class="account-profile-heading">
          <h2 id="profileNickname"></h2>
          <span id="profileLevel" class="account-level"></span>
        </div>
        <progress
          id="levelProgress"
          class="account-progress"
          aria-label="다음 레벨까지 별빛"
        ></progress>
        <p
          id="levelProgressText"
          class="account-help account-progress-label"
        ></p>
        <p class="account-joined">가입일 <time id="profileJoined"></time></p>
      </section>
      <section id="passwordCard" class="account-card" hidden>
        <h2 id="passwordTitle">비밀번호 설정</h2>
        <p class="account-help">
          이메일 인증을 마쳤어요. 다음 로그인에 쓸 비밀번호를 설정해주세요.
        </p>
        <form id="newPasswordForm">
          <label for="newPassword">새 비밀번호 (6자 이상)</label
          ><input
            id="newPassword"
            type="password"
            autocomplete="new-password"
            minlength="6"
            maxlength="128"
            required
          /><label for="confirmPassword">새 비밀번호 확인</label
          ><input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="6"
            maxlength="128"
            required
          /><button type="submit">비밀번호 저장</button>
        </form>
      </section>
      <section id="sessionCard" class="account-card account-settings" hidden>
        <p id="nicknameChangeHelp" class="account-help" hidden></p>
        <div class="account-row">
          <button id="editProfile" class="secondary" type="button">
            닉네임 수정
          </button>
          <button id="signOut" class="secondary" type="button">로그아웃</button
          ><button id="changePassword" class="secondary" type="button">
            비밀번호 변경
          </button>
          <a
            id="googleManage"
            class="account-help"
            href="https://myaccount.google.com/security"
            target="_blank"
            rel="noopener"
            hidden
            >Google 계정 관리</a
          >
        </div>
        <details id="withdrawDetails">
          <summary>회원 탈퇴</summary>
          <p>
            이 계정의 글·댓글·첨부 사진·리액션·신고·별빛·배지를 삭제합니다. 내
            글에 달린 다른 이용자의 댓글도 함께 삭제됩니다. 삭제를 시작하면
            되돌릴 수 없습니다.
          </p>
          <p class="account-help">
            공개 내용을 다른 사람이 저장한 사본은 회수할 수 없어요. 운영자
            계정은 운영 권한을 이전한 뒤 탈퇴할 수 있습니다.
          </p>
          <form id="withdrawForm">
            <div id="withdrawPasswordField">
              <label for="withdrawPassword">현재 비밀번호</label
              ><input
                id="withdrawPassword"
                type="password"
                autocomplete="current-password"
                required
              />
            </div>
            <p id="googleWithdrawHelp" class="account-help" hidden>
              Google에서 본인 계정을 다시 확인한 뒤, 이 화면에서 삭제를 최종
              확인합니다.
            </p>
            <label class="account-consent"
              ><input id="withdrawConsent" type="checkbox" required /><span
                >삭제할 내용을 확인했으며 회원 탈퇴에 동의합니다.</span
              ></label
            ><button type="submit" class="danger">내 계정과 활동 삭제</button>
          </form>
        </details>
      </section>
      <p class="account-help">
        <a href="privacy.html">개인정보처리방침</a> ·
        <a href="about.html#contact">도움이 필요해요</a>
      </p>
    </div></template>
    <script src="orbit-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
    <script src="orbit-backend.js?v=20260926-identity"></script>
    <script src="members.js?v=20260926-identity"></script>
    <script src="account-return.js?v=20260914-popover"></script>
  </body>
</html>
