name: 공식 우주 뉴스 갱신
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_news.py'
      - 'scripts/translate_news.py'
      - 'scripts/translation-requirements.txt'
      - '.github/workflows/news.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: official-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: RSS 파서 · 장애 복구 검증
        run: python -m unittest discover -s tests -p 'test_news.py'
      - name: 공식 제목과 원문 주소 갱신
        run: python scripts/update_news.py
      - name: 번역 초안을 만들 새 제목 확인
        id: translations
        run: echo "pending=$(python scripts/translate_news.py --pending)" >> "$GITHUB_OUTPUT"
      - name: 번역 모델 캐시
        if: steps.translations.outputs.pending != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: m2m100-55c2e61bbf05dfb8d7abccdc3fae6fc8512fd636
      - name: CPU 번역 도구 설치
        id: translator
        if: steps.translations.outputs.pending != '0'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/translation-requirements.txt
      - name: 한글 번역 초안 생성 · 검토 대기
        if: steps.translations.outputs.pending != '0' && steps.translator.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 6
        env:
          HF_HUB_DISABLE_XET: '1'
          HF_HUB_DOWNLOAD_TIMEOUT: '60'
        run: python scripts/translate_news.py
      # Drafts are never displayed before review. Translation is optional: a model outage must not block fresh official RSS.
      - name: 갱신 내역 저장
        id: save
        run: |
          if git diff --quiet -- data/news.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json
          git commit -m 'chore: refresh official space headlines'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      # A GITHUB_TOKEN commit does not trigger GitHub Pages' branch build.
      # Request its native build explicitly after the cached headlines change.
      - name: GitHub Pages 갱신
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
