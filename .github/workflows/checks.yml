name: 검사

# Pages is configured for GitHub Actions: only this checked commit is deployed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 천문 계산과 링크 검사는 브라우저가 필요 없다 — 먼저 돌려 빨리 실패시킨다
      - name: 천문 계산 검증
        run: node tests/astronomy.mjs

      - name: 링크 · 문서 검증
        run: node tests/links.mjs

      - name: 브라우저 설치
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 데이터베이스 권한 검증
        run: node tests/security.mjs

      - name: 회원·인증·탈퇴 검증
        run: npm run test:members

      - name: 메일 서명 · 운영 상태 · 뉴스 복구 검증
        run: node tests/operations.mjs

      - name: 게시판·회귀 검증
        run: node tests/community.mjs

      - name: 렌더링 검증
        run: node tests/render.mjs

      - name: 모바일 첫 화면 · 메뉴 검증
        run: node tests/landing.mjs

      - name: 관측 가이드 · 광고 비활성 및 오류 검증
        run: node tests/content.mjs

      - name: 공식 뉴스 파서 · 장애 복구 검증
        run: npm run test:news

      - name: 공통 메뉴 · 한글 뉴스 표시 검증
        run: npm run test:navigation

      - name: 우주 이야기 · 발행 제한 · 노트 저장본 보관 검사
        run: npm run test:stories

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: 최신 main인지 확인
        id: current
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "deploy=$([ "$current" = "$EXPECTED_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        if: steps.current.outputs.deploy == 'true'
      # Keep Jekyll's underscore exclusion so unpublished _editorial drafts stay private.
      - uses: actions/jekyll-build-pages@v1
        if: steps.current.outputs.deploy == 'true'
        with:
          source: ./
          destination: ./_site
      - name: 비공개 초안 제외 확인
        if: steps.current.outputs.deploy == 'true'
        run: test ! -e _site/_editorial
      - uses: actions/upload-pages-artifact@v3
        if: steps.current.outputs.deploy == 'true'
        with:
          path: ./_site
      - uses: actions/deploy-pages@v4
        if: steps.current.outputs.deploy == 'true'
        id: deployment
