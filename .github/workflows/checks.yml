name: 검사

# 이 사이트는 빌드 스텝이 없어서 «푸시 = 배포»다.
# 그래서 잘못된 계산이나 깨진 링크가 그대로 orbithere.com 에 올라간다.
# 배포를 막을 방법이 없는 대신, 무엇이 잘못됐는지는 바로 알 수 있게 해 둔다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 천문 계산과 링크 검사는 브라우저가 필요 없다 — 먼저 돌려 빨리 실패시킨다
      - name: 천문 계산 검증
        run: node tests/astronomy.mjs

      - name: 링크 · 문서 검증
        run: node tests/links.mjs

      - name: 브라우저 설치
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 렌더링 검증
        run: node tests/render.mjs
