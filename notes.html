<div class="retired-note"><p class="story-eyebrow">다음 이야기로</p><h1>우주 이야기에서<br>다시 만나요.</h1><p class="story-standfirst">관측 노트의 새 기록 작성은 종료했습니다. ORBIT 에디터가 전하는 우주 이야기를 만나보세요.</p><a class="story-link" href="stories.html">우주 이야기 읽기 →</a><section class="story-sources" aria-labelledby="savedHeading"><h2 id="savedHeading">이전에 저장한 기록이 있나요?</h2><p>저장했던 기기와 브라우저에서 이 주소를 열면 기록을 확인하고 파일로 보관할 수 있어요. 저장본은 직접 삭제하기 전까지 유지되며 서버로 전송하지 않습니다.</p><button class="story-button" id="showSavedNote" type="button" hidden>저장한 기록 확인</button><div id="savedNoteActions" hidden><label for="noteOutput">이전에 저장한 관측 노트</label><textarea id="noteOutput" rows="10" readonly></textarea><div class="story-share"><button class="story-button" id="copyNote" type="button">기록 복사</button><button class="story-button" id="downloadNote" type="button">텍스트로 내려받기</button><button class="story-button" id="deleteSavedNote" type="button">기기 저장본 삭제</button></div></div><p class="story-status" id="noteStatus" role="status"></p><noscript><p>저장본을 확인하려면 이 브라우저에서 자바스크립트를 허용해주세요. 기존 저장본은 자동 삭제하지 않습니다.</p></noscript></section></div>
